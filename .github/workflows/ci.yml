name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile check (syntax validation)
        run: python -m py_compile $(find . -name "*.py" -not -path "./.git/*")
      - name: Install lint tools
        run: pip install ruff
      - name: Ruff lint (errors only)
        run: ruff check --select E9,F --output-format=github .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime + test deps
        run: pip install -r requirements-rpi.txt pytest httpx
      - name: Run test suites
        run: python -m pytest test_dsp_core.py test_audio_wal.py test_blueos_extension.py -q
